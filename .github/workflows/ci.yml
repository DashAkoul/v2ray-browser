name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build both browsers
        run: npm run build

      # Fails the job on errors. The remaining warnings are React DOM internals
      # (`Function` constructor and `dangerouslySetInnerHTML`), reviewed in
      # docs/THREAT-MODEL.md; the linter has no way to attribute them to a vendor.
      - name: Lint the Firefox bundle
        run: npx web-ext lint --source-dir dist/firefox

      - name: Upload extension bundles
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: |
            dist/chrome
            dist/firefox
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build the Chromium extension
        run: npm run build:chrome

      - name: Run the end-to-end suite
        run: npm run e2e

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
